<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 280px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #171717;
    background: #fff;
  }
  .header {
    padding: 14px 16px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo { font-weight: 700; font-size: 15px; letter-spacing: -0.5px; }
  .body { padding: 14px 16px; }
  .status {
    padding: 8px 12px;
    border-radius: 6px;
    background: #f5f5f5;
    font-size: 12px;
    color: #737373;
    margin-bottom: 12px;
    text-align: center;
  }
  .status.ok { background: #f0fdf4; color: #16a34a; }
  .status.err { background: #fef2f2; color: #dc2626; }
  .btn {
    display: block;
    width: 100%;
    padding: 8px;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    background: #fff;
    color: #171717;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    margin-bottom: 6px;
  }
  .btn:hover { background: #f5f5f5; }
  .btn-primary { background: #171717; color: #fff; border-color: #171717; }
  .btn-primary:hover { background: #0a0a0a; }
  .hint { font-size: 11px; color: #a3a3a3; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
  <div class="header">
    <span class="logo">NovelForge</span>
  </div>
  <div class="body">
    <div class="status" id="status">检查中...</div>
    <div id="actions"></div>
    <div class="hint">在 chat.deepseek.com 页面使用</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
